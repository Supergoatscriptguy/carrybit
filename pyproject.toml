[project]
name = "carrybit"
version = "0.1.0"
description = "Tiny transformers learning exact integer arithmetic"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "torch==2.10.0",
    "numpy==2.5.3",
    "matplotlib==3.11.2",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
wandb = ["wandb"]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["carrybit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
