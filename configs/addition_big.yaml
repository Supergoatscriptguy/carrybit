# Scaled-up version of addition.yaml: deeper and wider model, train to 30 digits, test to 200.
# Used to check whether the ladder's weak generalization is a budget problem.
name: addition_big
task:
  kind: arithmetic
  max_digits: 30
  reverse: true
  zero_pad: false
  positions: sequential
  blanks: 0
  offset_max: 200
  test_digits: [10, 20, 30, 40, 50, 60, 80, 100, 150, 200]
  test_examples: 256
model:
  d_model: 384
  n_layers: 6
  n_heads: 6
  d_mlp: 1536
  max_positions: 1024
train:
  steps: 60000
  batch_size: 384
  lr: 2.0e-4
  weight_decay: 0.1
  warmup_steps: 2000
  cosine: true
  amp: true
  eval_every: 5000
  checkpoint_every: 20000
