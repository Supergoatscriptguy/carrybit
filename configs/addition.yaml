# Base config for the length generalization ladder. experiments/length_ladder.py
# overrides task.reverse, task.zero_pad, task.positions and task.blanks per rung.
name: addition
task:
  kind: arithmetic
  max_digits: 20
  reverse: true
  zero_pad: false
  positions: sequential
  blanks: 0
  offset_max: 100
  test_digits: [5, 10, 15, 20, 25, 30, 40, 50, 60, 80, 100]
  test_examples: 256
model:
  d_model: 256
  n_layers: 4
  n_heads: 4
  d_mlp: 1024
  max_positions: 1024
train:
  steps: 50000
  batch_size: 256
  lr: 3.0e-4
  weight_decay: 0.1
  warmup_steps: 1000
  cosine: true
  amp: true
  eval_every: 2500
  checkpoint_every: 10000
