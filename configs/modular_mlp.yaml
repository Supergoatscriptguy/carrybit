# Swaroop (2026) setup: one-hidden-layer ReLU MLP on two-hot inputs, p=97, 30% of pairs,
# full batch AdamW with weight decay 1. Dense checkpoints for the Fourier tracking.
name: modular_mlp
task:
  kind: modular
  p: 97
  train_frac: 0.3
model:
  arch: mlp
  d_mlp: 256
train:
  steps: 200000
  batch_size: 0
  lr: 1.0e-3
  weight_decay: 1.0
  betas: [0.9, 0.98]
  eval_every: 500
  checkpoint_every: 500
